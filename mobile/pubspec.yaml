name: repair_shop_app
description: A lightweight, mobile-first repair shop management application.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  # Local Databases & secure storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities & Networking
  http: ^1.2.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.3.3
  path: ^1.9.0
  connectivity_plus: ^7.3.2

  # Security: session tokens in the platform keystore, AES-GCM for customer device passcodes
  flutter_secure_storage: ^11.2.0
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
