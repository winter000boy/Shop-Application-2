# Render Blueprint: creates the PostgreSQL database and the backend API in one step.
# Render dashboard -> New -> Blueprint -> pick this repository. See DEPLOYMENT.md.
#
# Both start on the free plan so you can try everything at no cost. Free limits to know about:
#   - the API sleeps after 15 minutes without requests; the next request takes about a minute to wake it
#     (the app keeps working offline and syncs once the server is awake)
#   - the free database EXPIRES 30 days after creation. Upgrade it to a paid plan in the dashboard
#     before real shop data goes in.

databases:
  - name: fixmanager-db
    databaseName: fixmanager
    user: fixmanager
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: fixmanager-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # postgresql://... form; the backend converts it to a JDBC URL
      - key: DATABASE_URL
        fromDatabase:
          name: fixmanager-db
          property: connectionString
      # Random 256-bit keys generated once by Render. Keep a copy of DEVICE_SECRET_KEY somewhere safe:
      # without it, customer device passcodes stored in the database can't be decrypted.
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_SECRET_KEY
        generateValue: true
      # Optional: fill these in the dashboard to email password-reset codes (otherwise they appear in the logs)
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: PASSWORD_RESET_MAIL_FROM
        sync: false
