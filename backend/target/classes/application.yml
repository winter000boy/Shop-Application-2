server:
  port: 8080

spring:
  application:
    name: repair-shop-backend
  
  # Default Database Config: H2 In-Memory (Zero Setup required for testing)
  datasource:
    url: jdbc:h2:mem:repairshopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # To Switch to PostgreSQL, uncomment the following block and comment the H2 block above:
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/repairshop
  #   username: postgres
  #   password: yourpassword
  #   driver-class-name: org.postgresql.Driver
  # jpa:
  #   database-platform: org.hibernate.dialect.PostgreSQLDialect
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: false

app:
  jwt:
    # 256-bit secure secret key encoded in Base64 (For local dev: "antigravitysupersecurekeyformobilerepairshopmanagementappapplication")
    secret: YW50aWdyYXZpdHlzdXBlcnNlY3VyZWtleWZvcm1vYmlsZXJlcGFpcnNob3BtYW5hZ2VtZW50YXBwYXBwbGljYXRpb24=
    # Access token expires in 1 Hour (3600000 ms)
    accessTokenExpirationMs: 3600000
    # Refresh token expires in 7 Days (604800000 ms)
    refreshTokenExpirationMs: 604800000
