server:
  # Hosting platforms (e.g. Render) tell the app which port to listen on via PORT
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: repair-shop-backend
  profiles:
    # "dev" (H2 in-memory, zero setup) unless SPRING_PROFILES_ACTIVE says otherwise.
    default: dev
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Base64-encoded 256-bit key. Must come from the environment outside dev.
    secret: ${JWT_SECRET}
    # Access token expires in 1 Hour (3600000 ms)
    accessTokenExpirationMs: 3600000
    # Refresh token expires in 30 Days (2592000000 ms)
    refreshTokenExpirationMs: 2592000000
  crypto:
    # Base64-encoded 256-bit AES key used to encrypt customer device passcodes/patterns at rest.
    device-secret-key: ${DEVICE_SECRET_KEY}
  cors:
    # Comma-separated list of browser origins allowed to call the API. Native mobile apps don't need CORS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  password-reset:
    code-expiration-minutes: 15
    mail-from: ${PASSWORD_RESET_MAIL_FROM:no-reply@fixmanager.app}
