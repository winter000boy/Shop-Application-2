# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# Required environment variables:
#   DATABASE_URL       either jdbc:postgresql://host:5432/db (then also DATABASE_USERNAME / DATABASE_PASSWORD)
#                      or the postgresql://user:pass@host/db form hosting platforms provide (credentials included)
#   JWT_SECRET         base64, at least 32 bytes:  openssl rand -base64 48
#   DEVICE_SECRET_KEY  base64, exactly 32 bytes:   openssl rand -base64 32   (back it up; losing it makes stored passcodes unreadable)
# Optional: CORS_ALLOWED_ORIGINS, and SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
# to deliver password-reset codes by email (without them the code is only written to the server log).
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Small managed databases allow few connections; this is plenty for a shop app
      maximum-pool-size: 5
  mail:
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
