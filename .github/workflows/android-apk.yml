# Builds a signed Android APK in the cloud and attaches it to a GitHub Release.
# Runs on every push to master that changes the mobile app, or manually from the Actions tab ("Run workflow").
#
# One-time setup (repo -> Settings -> Secrets and variables -> Actions):
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS   (see DEPLOYMENT.md)
#   Variable (optional): API_BASE_URL, defaults to the Render backend below
name: Android APK

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://fixmanager-api.onrender.com/api/v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install packages and generate code
        run: |
          flutter pub get
          dart run build_runner build

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Every release must be signed with the same key, or phones refuse to install updates
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are missing. Add them under Settings -> Secrets and variables -> Actions (see DEPLOYMENT.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-key.jks"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Name the release after the app version
        id: version
        run: |
          # pubspec "version: 1.0.0+1" -> tag "app-v1.0.0-build1"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=app-v${VERSION/+/-build}" >> "$GITHUB_OUTPUT"
          echo "name=FixManager ${VERSION%%+*} (build ${VERSION##*+})" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/FixManager.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/FixManager.apk
          body: |
            Android app for the FixManager backend at ${{ env.API_BASE_URL }}.
            Download **FixManager.apk** below and install it on the phone (allow "Install unknown apps" when asked).
